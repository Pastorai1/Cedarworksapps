<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cedarworks Apps — Business Card (360onlineprint spec)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-deep: #143d28;
    --green-hero-a: #1f5236;
    --green-hero-b: #123a26;
    --cream: #f4ebd5;
    --sage: #b9c6b1;
    --orange: #d98b3c;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #6b6b6b; }
  body { font-family: var(--sans); display: flex; }

  /* Full upload canvas for 360onlineprint = 3.7008in x 2.126in (94 x 54 mm),
     background bleeds to the edge; all text kept inside a safe margin. */
  .bleed {
    width: 3.7008in; height: 2.126in;
    position: relative; overflow: hidden;
    color: var(--cream);
    background:
      radial-gradient(5.2in 3.0in at 30% -0.4in, var(--green-hero-a), transparent 70%),
      linear-gradient(180deg, var(--green-hero-b), var(--green-deep));
  }
  .bleed::before { content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 0.34in); }
  /* generous safe zone keeps everything inside the pink safety line */
  .safe { position: absolute; inset: 0; padding: 0.17in 0.19in; display: flex; align-items: stretch; z-index: 1; }

  .col { display: flex; flex-direction: column; justify-content: center; }
  .brand { flex: 0 0 41%; align-items: flex-start; }
  .contact-col { flex: 1; padding-left: 0.18in; }
  .divider { width: 1px; align-self: stretch; margin: 0.05in 0; background: rgba(244,235,213,0.24); }

  .mark { width: 0.37in; height: 0.37in; border-radius: 50%; border: 2px solid var(--orange); display: grid; place-items: center; }
  .mark svg { width: 0.185in; height: 0.185in; display:block; }

  .wordmark { font-weight: 700; letter-spacing: 0.15em; font-size: 12.5px; text-transform: uppercase; line-height: 1.25; margin-top: 0.10in; color: var(--cream); }
  .rule { width: 0.28in; height: 2px; background: var(--orange); margin: 0.09in 0; }
  .tagline { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 10px; line-height: 1.32; color: var(--sage); }

  .eyebrow { text-transform: uppercase; letter-spacing: 0.17em; font-weight: 700; font-size: 7px; margin-bottom: 0.11in; color: var(--orange); }
  .name { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1; color: var(--cream); }
  .contact { display: flex; flex-direction: column; gap: 0.075in; margin-top: 0.12in; }
  .contact .row { display: flex; align-items: center; gap: 0.09in; font-size: 10px; font-weight: 600; letter-spacing: 0; color: var(--cream); }
  .ico { width: 0.13in; height: 0.13in; flex: none; color: var(--orange); }
  .ico svg { width: 0.13in; height: 0.13in; display:block; }
</style>
</head>
<body>
  <div class="bleed" id="card">
    <div class="safe">
      <div class="col brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#d98b3c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22V8"/><path d="M12 8c0-2.5 1.6-4.2 4-4.5C16 6 14.4 7.8 12 8Z"/><path d="M12 8c0-2.5-1.6-4.2-4-4.5C8 6 9.6 7.8 12 8Z"/><path d="M12 13c0-2.2 1.5-3.7 3.6-4C15.6 11.3 14.1 12.8 12 13Z"/><path d="M12 13c0-2.2-1.5-3.7-3.6-4C8.4 11.3 9.9 12.8 12 13Z"/><path d="M12 18c0-2 1.4-3.4 3.3-3.7C15.3 16.4 13.9 17.8 12 18Z"/><path d="M12 18c0-2-1.4-3.4-3.3-3.7C8.7 16.4 10.1 17.8 12 18Z"/>
          </svg>
        </span>
        <div class="wordmark">Cedarworks<br>Apps</div>
        <div class="rule"></div>
        <div class="tagline">Practical AI apps,<br>built to do real work.</div>
      </div>
      <div class="divider"></div>
      <div class="col contact-col">
        <div class="eyebrow">Cedarworks Apps</div>
        <div class="name">James Chambers</div>
        <div class="contact">
          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>james@cedarworksapps.com</div>
          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.9.36 1.78.68 2.62a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.46-1.25a2 2 0 0 1 2.11-.45c.84.32 1.72.55 2.62.68A2 2 0 0 1 22 16.92Z"/></svg></span>417-370-2084</div>
          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20"/></svg></span>cedarworksapps.com</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
